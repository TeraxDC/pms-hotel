name: Deploy Frontend to cPanel

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-cpanel.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular PWA for Production
        run: npm run build -- --configuration=production

      - name: Ensure .htaccess is Present in Distribution
        run: |
          cp src/.htaccess dist/frontend/browser/.htaccess || cp src/.htaccess dist/browser/.htaccess || true

      - name: Deploy to cPanel via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./frontend/dist/frontend/browser/
          server-dir: /public_html/
          dangerous-clean-slate: false
